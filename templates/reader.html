<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Leitor — Calibre Jr.</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --text: #e0e0e0;
            --accent: #f97316;
            --accent-hover: #ea580c;
            --border: #333;
            --toolbar-h: 48px;
            --footer-h: 52px;
        }

        .theme-light {
            --bg: #f5f0e8;
            --surface: #ffffff;
            --text: #1a1a1a;
            --border: #d4d0c8;
        }

        .theme-sepia {
            --bg: #f4ecd8;
            --surface: #faf6ed;
            --text: #5b4636;
            --border: #d4c5a9;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background .3s, color .3s;
        }

        /* ── Toolbar ── */
        .toolbar {
            height: var(--toolbar-h);
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 8px;
            z-index: 50;
            flex-shrink: 0;
            transition: transform .3s, opacity .3s;
        }

        .toolbar.hidden {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }

        .toolbar button {
            background: none;
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: background .2s;
        }

        .toolbar button:hover {
            background: rgba(255, 255, 255, .08);
        }

        .book-title-bar {
            flex: 1;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
            opacity: .85;
        }

        /* ── Reader Area ── */
        #reader-area {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        foliate-view {
            width: 100%;
            height: 100%;
        }

        /* Book content theme via ::part(filter) — the official foliate-js API */
        body:not(.theme-light):not(.theme-sepia) foliate-view::part(filter) {
            filter: invert(1) hue-rotate(180deg);
        }

        body.theme-sepia foliate-view::part(filter) {
            filter: sepia(0.3) brightness(0.95);
        }

        body.theme-light foliate-view::part(filter) {
            filter: none;
        }

        /* ── Footer / Progress ── */
        .footer {
            height: var(--footer-h);
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
            z-index: 50;
            flex-shrink: 0;
            transition: transform .3s, opacity .3s;
        }

        .footer.hidden {
            transform: translateY(100%);
            opacity: 0;
            pointer-events: none;
        }

        .progress-slider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            border-radius: 2px;
            background: var(--border);
            outline: none;
            cursor: pointer;
        }

        .progress-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
        }

        .progress-label {
            font-size: 12px;
            opacity: .7;
            min-width: 40px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .page-info {
            font-size: 12px;
            opacity: .6;
            min-width: 80px;
        }

        /* ── TOC Sidebar ── */
        .toc-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .5);
            z-index: 90;
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s;
        }

        .toc-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .toc-panel {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: min(320px, 85vw);
            background: var(--surface);
            border-right: 1px solid var(--border);
            z-index: 100;
            transform: translateX(-100%);
            transition: transform .3s cubic-bezier(.4, 0, .2, 1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .toc-panel.open {
            transform: translateX(0);
        }

        .toc-header {
            padding: 14px 16px;
            font-weight: 600;
            font-size: 15px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toc-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .toc-item {
            padding: 10px 16px;
            cursor: pointer;
            font-size: 14px;
            border-bottom: 1px solid rgba(128, 128, 128, .1);
            transition: background .15s;
        }

        .toc-item:hover {
            background: rgba(128, 128, 128, .12);
        }

        .toc-item.active {
            color: var(--accent);
            font-weight: 600;
        }

        .toc-sub {
            padding-left: 32px;
            font-size: 13px;
            opacity: .8;
        }

        /* ── Settings Panel ── */
        .settings-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .5);
            z-index: 90;
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s;
        }

        .settings-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .settings-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface);
            border-top: 1px solid var(--border);
            border-radius: 16px 16px 0 0;
            z-index: 100;
            transform: translateY(100%);
            transition: transform .3s cubic-bezier(.4, 0, .2, 1);
            padding: 20px 16px 32px;
            max-height: 60vh;
            overflow-y: auto;
        }

        .settings-panel.open {
            transform: translateY(0);
        }

        .settings-title {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 16px;
            text-align: center;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(128, 128, 128, .1);
        }

        .setting-label {
            font-size: 14px;
        }

        .setting-options {
            display: flex;
            gap: 6px;
        }

        .setting-btn {
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: none;
            color: var(--text);
            cursor: pointer;
            font-size: 13px;
            transition: all .2s;
        }

        .setting-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .font-size-ctrl {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .font-size-ctrl button {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: none;
            color: var(--text);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .font-size-ctrl span {
            font-size: 14px;
            min-width: 40px;
            text-align: center;
        }

        /* ── Loading ── */
        .loading-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            z-index: 200;
            gap: 16px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            font-size: 14px;
            opacity: .7;
        }

        /* ── Navigation zones (tap/click) ── */
        .nav-zone {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 25%;
            z-index: 10;
            cursor: pointer;
        }

        .nav-zone-left {
            left: 0;
        }

        .nav-zone-right {
            right: 0;
        }

        .nav-zone-center {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 25%;
            right: 25%;
            z-index: 10;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- Toolbar -->
    <div class="toolbar" id="toolbar">
        <button onclick="closeReader()" title="Fechar">✕ Fechar</button>
        <button onclick="toggleTOC()" title="Sumário" id="btnToc">☰</button>
        <div class="book-title-bar" id="bookTitle">Carregando...</div>
        <button onclick="toggleSettings()" title="Configurações">⚙</button>
    </div>

    <!-- Reader -->
    <div id="reader-area">
        <div class="loading-screen" id="loadingScreen">
            <div class="spinner"></div>
            <div class="loading-text">Carregando livro...</div>
        </div>
        <!-- Tap zones for navigation -->
        <div class="nav-zone nav-zone-left" onclick="goPrev()"></div>
        <div class="nav-zone nav-zone-center" onclick="toggleUI()"></div>
        <div class="nav-zone nav-zone-right" onclick="goNext()"></div>
    </div>

    <!-- Footer / Progress -->
    <div class="footer" id="footer">
        <span class="page-info" id="pageInfo"></span>
        <input type="range" class="progress-slider" id="progressSlider" min="0" max="100" step="0.1" value="0">
        <span class="progress-label" id="progressLabel">0%</span>
    </div>

    <!-- TOC Panel -->
    <div class="toc-overlay" id="tocOverlay" onclick="toggleTOC()"></div>
    <div class="toc-panel" id="tocPanel">
        <div class="toc-header">
            <span>Sumário</span>
            <button onclick="toggleTOC()"
                style="background:none;border:none;color:var(--text);font-size:18px;cursor:pointer">✕</button>
        </div>
        <div class="toc-list" id="tocList"></div>
    </div>

    <!-- Settings Panel -->
    <div class="settings-overlay" id="settingsOverlay" onclick="toggleSettings()"></div>
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-title">Configurações de Leitura</div>

        <div class="setting-row">
            <span class="setting-label">Tema</span>
            <div class="setting-options" id="themeOptions">
                <button class="setting-btn active" data-theme="">🌙 Escuro</button>
                <button class="setting-btn" data-theme="theme-light">☀ Claro</button>
                <button class="setting-btn" data-theme="theme-sepia">📜 Sépia</button>
            </div>
        </div>

        <div class="setting-row">
            <span class="setting-label">Tamanho da Fonte</span>
            <div class="font-size-ctrl">
                <button onclick="changeFontSize(-1)">−</button>
                <span id="fontSizeLabel">100%</span>
                <button onclick="changeFontSize(1)">+</button>
            </div>
        </div>

        <div class="setting-row">
            <span class="setting-label">Modo</span>
            <div class="setting-options" id="flowOptions">
                <button class="setting-btn active" data-flow="paginated">📄 Paginado</button>
                <button class="setting-btn" data-flow="scrolled">📜 Scroll</button>
            </div>
        </div>
    </div>

    <script type="module">
        import 'https://cdn.jsdelivr.net/gh/johnfactotum/foliate-js@latest/view.js'

        const params = new URLSearchParams(window.location.search)
        const bookId = params.get('id')
        if (!bookId) { alert('Nenhum livro selecionado.'); window.history.back(); }

        const view = document.createElement('foliate-view')
        const readerArea = document.getElementById('reader-area')
        readerArea.prepend(view)

        let currentCfi = null
        let currentFraction = 0
        let saveTimeout = null
        let fontSize = 100
        let tocData = []
        let uiVisible = true

        // ── Load Book ──
        async function loadBook() {
            try {
                const res = await fetch(`/api/books/${bookId}/file`)
                if (!res.ok) throw new Error(`HTTP ${res.status}`)

                const blob = await res.blob()
                // foliate-js needs a filename to detect the format (endsWith check)
                const disposition = res.headers.get('content-disposition') || ''
                const filenameMatch = disposition.match(/filename\*?=(?:UTF-8''|"?)([^";]+)"?/)
                const filename = filenameMatch ? decodeURIComponent(filenameMatch[1]) : 'book.epub'
                const file = new File([blob], filename, { type: blob.type })
                await view.open(file)

                // Set initial paginator attributes
                view.setAttribute('flow', 'paginated')
                view.setAttribute('animated', '')
                view.setAttribute('max-column-count', '2')
                view.setAttribute('max-inline-size', '720')

                document.getElementById('loadingScreen').remove()

                // Load metadata
                const metaRes = await fetch(`/api/books?_=${Date.now()}`)

                // Get book info for title
                const infoRes = await fetch(`/api/books`)
                if (infoRes.ok) {
                    const books = await infoRes.json()
                    const book = books.find(b => b.id === parseInt(bookId))
                    if (book) {
                        document.getElementById('bookTitle').textContent = book.title
                        document.title = `${book.title} — Calibre Jr.`
                    }
                }

                // Build TOC
                if (view.book?.toc) {
                    tocData = view.book.toc
                    renderTOC(tocData)
                }

                // Restore progress
                const progRes = await fetch(`/api/books/${bookId}/progress`)
                if (progRes.ok) {
                    const prog = await progRes.json()
                    if (prog.cfi_location) {
                        try { await view.goTo(prog.cfi_location) } catch (e) { console.warn('CFI restore failed:', e) }
                    } else if (prog.progress_percent != null) {
                        try { await view.goToFraction(prog.progress_percent / 100) } catch (e) { console.warn('Fraction restore failed:', e) }
                    }
                }

            } catch (err) {
                console.error('Error loading book:', err)
                document.getElementById('loadingScreen').innerHTML = `
                    <div style="text-align:center;padding:20px">
                        <p style="font-size:18px;margin-bottom:12px">❌ Erro ao carregar livro</p>
                        <p style="opacity:.6;margin-bottom:16px">${err.message}</p>
                        <button onclick="window.history.back()" style="padding:8px 20px;border-radius:8px;border:1px solid var(--border);background:var(--accent);color:#fff;cursor:pointer">Voltar</button>
                    </div>
                `
            }
        }

        // ── Events ──
        view.addEventListener('relocate', e => {
            const { fraction, cfi, section } = e.detail
            currentFraction = fraction ?? 0

            if (cfi) currentCfi = cfi

            // Overall progress: combine section progress with fraction within section
            let totalFraction = 0
            if (view.book?.sections) {
                const sections = view.book.sections
                const sectionIndex = section?.current?.index ?? 0
                const sectionCount = sections.length
                totalFraction = (sectionIndex + currentFraction) / sectionCount
            } else {
                totalFraction = currentFraction
            }

            const percent = Math.min(100, Math.max(0, totalFraction * 100))
            document.getElementById('progressSlider').value = percent
            document.getElementById('progressLabel').textContent = `${Math.round(percent)}%`

            // Debounced save
            clearTimeout(saveTimeout)
            saveTimeout = setTimeout(() => saveProgress(percent), 3000)
        })

        view.addEventListener('load', e => {
            const { doc } = e.detail
            // Apply font size to loaded section
            applyFontSize(doc)
        })

        // ── Progress Slider ──
        document.getElementById('progressSlider').addEventListener('input', e => {
            const frac = parseFloat(e.target.value) / 100
            try { view.goToFraction(frac) } catch (err) { console.warn(err) }
        })

        // ── Save / Load Progress ──
        async function saveProgress(percent) {
            try {
                await fetch(`/api/books/${bookId}/progress`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cfi_location: currentCfi || null,
                        progress_percent: percent
                    })
                })
            } catch (e) { console.warn('Save progress failed:', e) }
        }

        // ── TOC ──
        function renderTOC(items, container, depth = 0) {
            const list = container || document.getElementById('tocList')
            for (const item of items) {
                const div = document.createElement('div')
                div.className = 'toc-item' + (depth > 0 ? ' toc-sub' : '')
                div.textContent = item.label || 'Sem título'
                div.style.paddingLeft = `${16 + depth * 16}px`
                div.addEventListener('click', () => {
                    view.goTo(item.href)
                    toggleTOC()
                })
                list.appendChild(div)

                if (item.subitems?.length) {
                    renderTOC(item.subitems, list, depth + 1)
                }
            }
        }

        // ── Font Size for Book Content ──
        let loadedDocs = []
        function applyFontSize(doc) {
            if (!doc) return
            // Add doc to loadedDocs if not already present
            if (!loadedDocs.includes(doc)) {
                loadedDocs.push(doc)
            }
            let style = doc.getElementById('calibre-jr-styles')
            if (!style) {
                style = doc.createElement('style')
                style.id = 'calibre-jr-styles'
                doc.head?.appendChild(style)
            }
            style.textContent = `
                html { font-size: ${fontSize}% !important; }
                img { max-width: 100% !important; height: auto !important; }
            `
        }

        // ── Global Functions ──
        window.closeReader = () => {
            // Save progress before closing
            clearTimeout(saveTimeout)
            const percent = parseFloat(document.getElementById('progressSlider').value)
            saveProgress(percent)
            // window.close() works when opened via window.open; fallback to history
            window.close()
            setTimeout(() => window.history.back(), 100)
        }
        window.goPrev = () => { try { view.prev() } catch (e) { } }
        window.goNext = () => { try { view.next() } catch (e) { } }

        window.toggleUI = () => {
            uiVisible = !uiVisible
            document.getElementById('toolbar').classList.toggle('hidden', !uiVisible)
            document.getElementById('footer').classList.toggle('hidden', !uiVisible)
        }

        window.toggleTOC = () => {
            document.getElementById('tocOverlay').classList.toggle('open')
            document.getElementById('tocPanel').classList.toggle('open')
        }

        window.toggleSettings = () => {
            document.getElementById('settingsOverlay').classList.toggle('open')
            document.getElementById('settingsPanel').classList.toggle('open')
        }

        window.changeFontSize = (delta) => {
            fontSize = Math.max(70, Math.min(200, fontSize + delta * 10))
            document.getElementById('fontSizeLabel').textContent = `${fontSize}%`
            // Re-apply font size to all loaded docs
            loadedDocs.forEach(doc => applyFontSize(doc))
        }

        // ── Theme Buttons ── (CSS ::part(filter) handles the content automatically)
        document.getElementById('themeOptions').addEventListener('click', e => {
            const btn = e.target.closest('.setting-btn')
            if (!btn) return
            document.querySelectorAll('#themeOptions .setting-btn').forEach(b => b.classList.remove('active'))
            btn.classList.add('active')
            document.body.className = btn.dataset.theme || ''
        })

        // ── Flow Mode Buttons ──
        document.getElementById('flowOptions').addEventListener('click', e => {
            const btn = e.target.closest('.setting-btn')
            if (!btn) return
            document.querySelectorAll('#flowOptions .setting-btn').forEach(b => b.classList.remove('active'))
            btn.classList.add('active')
            view.setAttribute('flow', btn.dataset.flow)
        })

        // ── Keyboard Navigation ──
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' || e.key === 'PageUp') { goPrev(); e.preventDefault() }
            else if (e.key === 'ArrowRight' || e.key === 'PageDown') { goNext(); e.preventDefault() }
            else if (e.key === 'Escape') {
                if (document.getElementById('tocPanel').classList.contains('open')) toggleTOC()
                else if (document.getElementById('settingsPanel').classList.contains('open')) toggleSettings()
                else goBack()
            }
        })

        // ── Init ──
        loadBook()
    </script>
</body>

</html>

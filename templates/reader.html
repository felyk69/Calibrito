<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Modern E-book Reader Interface — Calibre Jr.</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#F59E0B", // Amber-500
                        "background-light": "#F9F9F9",
                        "background-dark": "#121212",
                        "surface-light": "#FFFFFF",
                        "surface-dark": "#1E1E1E",
                        "text-light": "#333333",
                        "text-dark": "#E0E0E0",
                    },
                    fontFamily: {
                        sans: ["Inter", "sans-serif"],
                        serif: ["Merriweather", "serif"],
                    },
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.37)',
                    }
                },
            },
        };
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #777;
        }

        .glass-panel {
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .light-glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        foliate-view {
            width: 100%;
            height: 100%;
            display: block;
            --_margin: 0px !important;
        }

        /* Reading Themes via Foliate CSS parts */
        body.theme-sepia {
            background-color: #F4ECD8;
            color: #5b4636;
        }

        body.theme-sepia foliate-view::part(filter) {
            filter: sepia(0.3) brightness(0.95);
        }

        body.theme-dark {
            background-color: #121212;
            color: #e0e0e0;
        }

        body.theme-dark foliate-view::part(filter) {
            filter: invert(1) hue-rotate(180deg);
        }

        /* Default is light */
        body.theme-light foliate-view::part(filter) {
            filter: none;
        }

        #reader-area {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .nav-zone {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 20%;
            z-index: 10;
            cursor: pointer;
        }

        .nav-zone-left {
            left: 0;
        }

        .nav-zone-right {
            right: 0;
        }

        .nav-zone-center {
            left: 20%;
            right: 20%;
            z-index: 10;
            cursor: pointer;
        }

        /* Spinner logic */
        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        .spinner {
            animation: spin 1s linear infinite;
        }
    </style>
</head>

<body
    class="theme-dark bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark font-sans h-[100dvh] overflow-hidden flex flex-col transition-colors duration-300 antialiased">

    <div class="fixed inset-0 z-[200] flex flex-col items-center justify-center bg-background-light dark:bg-background-dark transition-opacity"
        id="loadingScreen">
        <div class="w-10 h-10 border-4 border-gray-300 border-t-primary rounded-full spinner mb-4"></div>
        <div class="text-sm font-medium text-gray-500">Loading Book...</div>
    </div>

    <!-- Header Toolbar -->
    <header id="toolbar"
        class="h-16 flex items-center justify-between px-6 border-b border-gray-200 dark:border-gray-800 bg-surface-light/90 dark:bg-surface-dark/90 backdrop-blur-md z-40 absolute top-0 w-full transition-all duration-300">
        <div class="flex items-center space-x-4">
            <button onclick="closeReader()"
                class="flex items-center space-x-2 text-gray-600 dark:text-gray-400 hover:text-primary transition-colors">
                <span class="material-icons-round">close</span>
                <span class="text-sm font-medium hidden sm:block">Close</span>
            </button>
            <button onclick="toggleTOC()"
                class="p-2 rounded-lg text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                <span class="material-icons-round">menu</span>
            </button>
        </div>
        <div class="flex-1 text-center truncate">
            <h1 id="bookTitle"
                class="font-serif text-lg font-bold tracking-tight text-gray-900 dark:text-gray-100 truncate mx-auto max-w-md">
                Loading...</h1>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="toggleSettings()"
                class="p-2 rounded-full text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
                title="Settings">
                <span class="material-icons-round text-xl">settings</span>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 flex relative overflow-hidden pt-16 pb-8 w-full h-full">

        <!-- Table of Contents Sidebar -->
        <aside id="tocPanel"
            class="absolute left-0 top-16 bottom-8 w-80 z-30 transform -translate-x-full transition-transform duration-300 border-r border-gray-200 dark:border-gray-800 flex flex-col bg-surface-light dark:bg-surface-dark glass-panel dark:glass-panel shadow-2xl">
            <div class="p-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
                <h2 class="text-sm font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">Table of
                    Contents</h2>
                <button onclick="toggleTOC()" class="text-gray-400 hover:text-primary"><span
                        class="material-icons-round text-sm">close</span></button>
            </div>
            <div id="tocList" class="overflow-y-auto flex-1 p-2 space-y-1">
                <!-- Injected via JS -->
            </div>
        </aside>

        <!-- Viewer Container -->
        <div class="flex-1 w-full h-full relative" id="reader-container">
            <div id="reader-area">
                <!-- Foliate view injected here -->
                <div class="nav-zone nav-zone-left" onclick="goPrev()"></div>
                <div class="nav-zone nav-zone-center" onclick="toggleUI()"></div>
                <div class="nav-zone nav-zone-right" onclick="goNext()"></div>
            </div>
        </div>
    </main>

    <!-- Settings Modal Panel -->
    <div id="settingsPanel"
        class="absolute bottom-10 left-1/2 transform -translate-x-1/2 w-full max-w-2xl px-4 z-40 hidden opacity-0 transition-opacity duration-200">
        <div
            class="bg-surface-light dark:bg-surface-dark border border-gray-200 dark:border-gray-700 rounded-2xl shadow-glass p-6 backdrop-blur-xl bg-opacity-95">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-sm font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider">Reading Settings
                </h3>
                <button onclick="toggleSettings()" class="text-gray-400 hover:text-primary"><span
                        class="material-icons-round text-sm">close</span></button>
            </div>

            <div class="grid grid-cols-4 gap-4 mb-6">
                <div
                    class="col-span-1 text-center flex items-center justify-center font-bold text-xs text-gray-500 uppercase">
                    Theme</div>
                <button data-theme="theme-light"
                    class="theme-btn flex flex-col sm:flex-row items-center justify-center space-x-0 sm:space-x-2 py-2 px-4 rounded-lg border border-gray-300 hover:border-primary bg-white text-gray-900 transition-all font-medium text-sm">
                    <span class="material-icons-round text-sm hidden sm:inline">light_mode</span><span>Light</span>
                </button>
                <button data-theme="theme-dark"
                    class="theme-btn flex flex-col sm:flex-row items-center justify-center space-x-0 sm:space-x-2 py-2 px-4 rounded-lg bg-primary text-white shadow-lg shadow-orange-500/20 active-theme transition-all ring-2 ring-primary ring-offset-2 ring-offset-surface-dark font-medium text-sm">
                    <span class="material-icons-round text-sm hidden sm:inline">dark_mode</span><span>Dark</span>
                </button>
                <button data-theme="theme-sepia"
                    class="theme-btn flex flex-col sm:flex-row items-center justify-center space-x-0 sm:space-x-2 py-2 px-4 rounded-lg border border-transparent bg-[#F4ECD8] text-[#5b4636] hover:bg-[#e8dec0] transition-all font-medium text-sm">
                    <span class="material-icons-round text-sm hidden sm:inline">auto_stories</span><span>Sepia</span>
                </button>
            </div>

            <div class="h-px bg-gray-200 dark:bg-gray-700 mb-6"></div>

            <div class="flex items-center justify-between gap-6">
                <div class="flex-1 flex items-center justify-between bg-gray-100 dark:bg-gray-800 rounded-lg p-1">
                    <span class="pl-4 text-xs font-medium text-gray-500 uppercase">Size</span>
                    <div class="flex items-center space-x-2 pr-2">
                        <button onclick="changeFontSize(-10)"
                            class="w-8 h-8 flex items-center justify-center rounded-full bg-white dark:bg-gray-700 text-gray-600 dark:text-gray-200 shadow hover:scale-110">-</button>
                        <span id="fontSizeDisplay" class="text-sm font-bold w-12 text-center">100%</span>
                        <button onclick="changeFontSize(10)"
                            class="w-8 h-8 flex items-center justify-center rounded-full bg-white dark:bg-gray-700 text-gray-600 dark:text-gray-200 shadow hover:scale-110">+</button>
                    </div>
                </div>
                <div class="flex items-center bg-gray-100 dark:bg-gray-800 rounded-lg p-1">
                    <button data-flow="paginated"
                        class="flow-btn flex items-center space-x-2 px-4 py-2 rounded-md bg-white dark:bg-gray-700 shadow-sm text-primary font-medium transition-all active-flow">
                        <span class="material-icons-round text-sm">import_contacts</span><span
                            class="text-xs">Paginated</span>
                    </button>
                    <button data-flow="scrolled"
                        class="flow-btn flex items-center space-x-2 px-4 py-2 rounded-md text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-200 transition-all">
                        <span class="material-icons-round text-sm">swap_vert</span><span class="text-xs">Scroll</span>
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between gap-6 mt-4">
                <div class="flex-1 flex items-center justify-between bg-gray-100 dark:bg-gray-800 rounded-lg p-1">
                    <span class="pl-4 text-xs font-medium text-gray-500 uppercase">Margin X</span>
                    <div class="flex items-center space-x-2 pr-2">
                        <button onclick="changeMargin('x', -10)"
                            class="w-8 h-8 flex items-center justify-center rounded-full bg-white dark:bg-gray-700 text-gray-600 dark:text-gray-200 shadow hover:scale-110">-</button>
                        <span id="marginXDisplay" class="text-sm font-bold w-12 text-center">20px</span>
                        <button onclick="changeMargin('x', 10)"
                            class="w-8 h-8 flex items-center justify-center rounded-full bg-white dark:bg-gray-700 text-gray-600 dark:text-gray-200 shadow hover:scale-110">+</button>
                    </div>
                </div>
                <div class="flex-1 flex items-center justify-between bg-gray-100 dark:bg-gray-800 rounded-lg p-1">
                    <span class="pl-4 text-xs font-medium text-gray-500 uppercase">Margin Y</span>
                    <div class="flex items-center space-x-2 pr-2">
                        <button onclick="changeMargin('y', -10)"
                            class="w-8 h-8 flex items-center justify-center rounded-full bg-white dark:bg-gray-700 text-gray-600 dark:text-gray-200 shadow hover:scale-110">-</button>
                        <span id="marginYDisplay" class="text-sm font-bold w-12 text-center">40px</span>
                        <button onclick="changeMargin('y', 10)"
                            class="w-8 h-8 flex items-center justify-center rounded-full bg-white dark:bg-gray-700 text-gray-600 dark:text-gray-200 shadow hover:scale-110">+</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Progress Display -->
    <footer id="footer"
        class="h-8 border-t border-gray-200 dark:border-gray-800 bg-surface-light dark:bg-surface-dark flex flex-col justify-center px-0 z-40 w-full absolute bottom-0 transition-all duration-300">
        <div class="w-full h-1 bg-gray-200 dark:bg-gray-700 relative group cursor-pointer"
            onclick="clickProgressBar(event)">
            <div id="progressBarFill" class="absolute h-full bg-primary w-[0%] transition-all duration-300"></div>
            <div id="progressBarThumb"
                class="absolute h-2 w-2 bg-primary rounded-full top-1/2 -mt-1 shadow-md opacity-100 transition-all"
                style="left: 0%;"></div>
        </div>
        <div class="flex justify-between items-center px-6 mt-1">
            <span class="text-[10px] sm:text-xs text-gray-400 dark:text-gray-500 font-mono" id="progressInfo">Página:
                Calculando...</span>
            <span class="text-[10px] sm:text-xs text-gray-400 dark:text-gray-500 font-mono font-bold"
                id="progressPct">0%</span>
        </div>
    </footer>

    <script type="module">
        import 'https://cdn.jsdelivr.net/gh/johnfactotum/foliate-js@latest/view.js';

        const params = new URLSearchParams(window.location.search);
        const bookId = params.get('id');
        if (!bookId) { alert('Nenhum livro selecionado.'); window.history.back(); }

        const view = document.createElement('foliate-view');
        const readerArea = document.getElementById('reader-area');
        readerArea.prepend(view);

        let currentCfi = null;
        let currentFraction = 0;
        let saveTimeout = null;
        let fontSize = 100;
        let marginX = 20;
        let marginY = 40;
        let tocData = [];
        let uiVisible = true;
        let loadedDocs = [];

        // ── Initialization ──
        async function loadBook() {
            try {
                const res = await fetch(`/api/v1/books/${bookId}/file`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                const blob = await res.blob();
                const disposition = res.headers.get('content-disposition') || '';
                const filenameMatch = disposition.match(/filename\*?=(?:UTF-8''|"?)([^";]+)"?/);
                const filename = filenameMatch ? decodeURIComponent(filenameMatch[1]) : 'book.epub';
                const file = new File([blob], filename, { type: blob.type });

                await view.open(file);

                // Default Foliate params
                view.setAttribute('flow', 'paginated');
                view.setAttribute('animated', 'true');
                view.setAttribute('max-column-count', '2');

                // Fade out loading
                const loadScreen = document.getElementById('loadingScreen');
                loadScreen.classList.add('opacity-0');
                setTimeout(() => loadScreen.remove(), 300);

                // Load Info
                fetch(`/api/v1/books`).then(r => r.json()).then(books => {
                    const b = books.find(b => b.id === parseInt(bookId));
                    if (b) {
                        document.getElementById('bookTitle').textContent = b.title;
                        document.title = `${b.title} — Calibre Jr. Reader`;
                    }
                });

                if (view.book?.toc) {
                    tocData = view.book.toc;
                    renderTOC(tocData);
                }

                const progRes = await fetch(`/api/v1/books/${bookId}/progress`);
                if (progRes.ok) {
                    const prog = await progRes.json();
                    if (prog.cfi_location) {
                        try { await view.goTo(prog.cfi_location); } catch (e) { }
                    } else if (prog.progress_percent != null) {
                        try { await view.goToFraction(prog.progress_percent / 100); } catch (e) { }
                    }
                }

            } catch (err) {
                console.error(err);
                document.getElementById('loadingScreen').innerHTML = `
                    <div class="text-xl font-bold mb-2">❌ Erro ao Carregar Livro</div>
                    <div class="text-sm opacity-70 mb-4">${err.message}</div>
                    <button onclick="window.history.back()" class="bg-primary px-4 py-2 rounded-md font-bold text-white">Voltar</button>
                `;
            }
        }

        // ── Foliate listeners ──
        view.addEventListener('relocate', e => {
            const { fraction, cfi, section } = e.detail;
            currentFraction = fraction ?? 0;
            if (cfi) currentCfi = cfi;

            let totalFraction = currentFraction;
            if (view.book?.sections) {
                const sections = view.book.sections;
                const sectionIndex = section?.current?.index ?? 0;
                totalFraction = (sectionIndex + currentFraction) / sections.length;
                document.getElementById('progressInfo').textContent = `Seção ${sectionIndex + 1} de ${sections.length}`;
            }

            const percent = Math.min(100, Math.max(0, totalFraction * 100));
            document.getElementById('progressBarFill').style.width = percent + '%';
            document.getElementById('progressBarThumb').style.left = percent + '%';
            document.getElementById('progressPct').textContent = Math.round(percent) + '%';

            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => saveProgress(percent), 3000);
        });

        view.addEventListener('load', e => {
            const { doc } = e.detail;
            applyFontSize(doc);
        });

        // ── API logic ──
        async function saveProgress(percent) {
            try {
                await fetch(`/api/v1/books/${bookId}/progress`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cfi_location: currentCfi, progress_percent: percent })
                });
            } catch (e) { }
        }

        function renderTOC(items, container, depth = 0) {
            const list = container || document.getElementById('tocList');
            for (const item of items) {
                const a = document.createElement('a');
                a.className = 'block px-4 py-3 rounded-lg text-sm transition-colors text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800/50 cursor-pointer';
                a.style.marginLeft = `${depth * 16}px`;
                a.textContent = item.label || 'Sem título';
                a.onclick = () => { view.goTo(item.href); toggleTOC(); };
                list.appendChild(a);
                if (item.subitems?.length) renderTOC(item.subitems, list, depth + 1);
            }
        }

        function applyFontSize(doc) {
            if (!doc) return;
            if (!loadedDocs.includes(doc)) loadedDocs.push(doc);
            let style = doc.getElementById('calibre-jr-styles');
            if (!style) {
                style = doc.createElement('style');
                style.id = 'calibre-jr-styles';
                doc.head?.appendChild(style);
            }
            style.textContent = `
                html { font-size: ${fontSize}% !important; font-family: 'Merriweather', serif !important; }
                img { max-width: 100% !important; height: auto !important; }
            `;
        }

        // ── Window Bindings ──
        window.closeReader = () => {
            clearTimeout(saveTimeout);
            saveProgress(parseFloat(document.getElementById('progressPct').textContent));
            window.close();
            setTimeout(() => window.history.back(), 100);
        };
        window.goPrev = () => { try { view.prev() } catch (e) { } };
        window.goNext = () => { try { view.next() } catch (e) { } };

        window.toggleUI = () => {
            uiVisible = !uiVisible;
            document.getElementById('toolbar').style.transform = uiVisible ? 'translateY(0)' : 'translateY(-100%)';
            document.getElementById('footer').style.transform = uiVisible ? 'translateY(0)' : 'translateY(100%)';
        };

        window.toggleTOC = () => {
            const el = document.getElementById('tocPanel');
            if (el.classList.contains('-translate-x-full')) {
                el.classList.remove('-translate-x-full');
            } else {
                el.classList.add('-translate-x-full');
            }
        };

        window.toggleSettings = () => {
            const panel = document.getElementById('settingsPanel');
            if (panel.classList.contains('hidden')) {
                panel.classList.remove('hidden');
                setTimeout(() => panel.classList.remove('opacity-0'), 10);
            } else {
                panel.classList.add('opacity-0');
                setTimeout(() => panel.classList.add('hidden'), 200);
            }
        };

        window.changeFontSize = (delta) => {
            fontSize = Math.max(70, Math.min(250, fontSize + delta));
            document.getElementById('fontSizeDisplay').textContent = `${fontSize}%`;
            loadedDocs.forEach(d => applyFontSize(d));
        };

        window.changeMargin = (axis, delta) => {
            if (axis === 'x') {
                marginX = Math.max(0, Math.min(150, marginX + delta));
                document.getElementById('marginXDisplay').textContent = `${marginX}px`;
            } else {
                marginY = Math.max(0, Math.min(150, marginY + delta));
                document.getElementById('marginYDisplay').textContent = `${marginY}px`;
            }
            applyMargins();
        };

        function applyMargins() {
            const readerArea = document.getElementById('reader-area');
            readerArea.style.padding = `${marginY}px ${marginX}px`;
            // Foliate has a default internal margin of 48px, causing padding below 48 to not take effect
            // We tell foliate internal margin to be 0 so our wrapper padding takes full control 
            if (view && typeof view.setAttribute === 'function') {
                view.setAttribute('margin', '0');
            }
        }

        window.clickProgressBar = (e) => {
            const rect = e.currentTarget.getBoundingClientRect();
            let frac = (e.clientX - rect.left) / rect.width;
            try { view.goToFraction(frac); } catch (e) { }
        };

        // Theme Binding
        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.theme-btn').forEach(b => {
                    b.classList.remove('bg-primary', 'text-white', 'shadow-lg', 'ring-2', 'active-theme');
                    // restore defaults
                    if (b.dataset.theme == 'theme-light') { b.classList.add('bg-white', 'text-gray-900', 'border', 'border-gray-300'); }
                    if (b.dataset.theme == 'theme-dark') { b.classList.add('bg-gray-800', 'text-white', 'border', 'border-gray-700'); }
                    if (b.dataset.theme == 'theme-sepia') { b.classList.add('bg-[#F4ECD8]', 'text-[#5b4636]', 'border', 'border-[#e8dec0]'); }
                });

                // Style Active
                btn.className = "theme-btn flex flex-col sm:flex-row items-center justify-center space-x-0 sm:space-x-2 py-2 px-4 rounded-lg bg-primary text-white shadow-lg shadow-orange-500/20 active-theme transition-all ring-2 ring-primary ring-offset-2 ring-offset-surface-dark font-medium text-sm";

                // Apply class to body for foliate part override
                document.body.className = `font-sans h-[100dvh] overflow-hidden flex flex-col transition-colors duration-300 antialiased ${btn.dataset.theme}`;

                // Keep html tag synchronized for tailwind overrides
                if (btn.dataset.theme === 'theme-light' || btn.dataset.theme === 'theme-sepia') {
                    document.documentElement.classList.remove('dark');
                } else {
                    document.documentElement.classList.add('dark');
                }
            });
        });

        // Flow Binding
        document.querySelectorAll('.flow-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.flow-btn').forEach(b => {
                    b.className = "flow-btn flex items-center space-x-2 px-4 py-2 rounded-md text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-200 transition-all";
                });
                btn.className = "flow-btn flex items-center space-x-2 px-4 py-2 rounded-md bg-white dark:bg-gray-700 shadow-sm text-primary font-medium transition-all active-flow";
                view.setAttribute('flow', btn.dataset.flow);
            });
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' || e.key === 'PageUp') { goPrev(); e.preventDefault() }
            else if (e.key === 'ArrowRight' || e.key === 'PageDown') { goNext(); e.preventDefault() }
            else if (e.key === 'Escape') {
                if (!document.getElementById('tocPanel').classList.contains('-translate-x-full')) toggleTOC();
                else if (!document.getElementById('settingsPanel').classList.contains('hidden')) toggleSettings();
                else window.history.back();
            }
        });

        // Initialize
        applyMargins();
        loadBook();
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Configurações - Library Manager</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#3B82F6", // Vibrant Blue for primary action
                        "primary-dark": "#2563EB", // Darker blue for hover
                        "accent": "#3B82F6",
                        "background-light": "#F3F4F6", // Light grey background for body
                        "surface-light": "#FFFFFF", // White modal background
                        "card-light": "#F9FAFB", // Slightly off-white for cards
                        "border-light": "#E5E7EB",
                        "text-main": "#1F2937", // Dark charcoal
                        "text-sub": "#6B7280", // Gray for subtext
                        "input-bg": "#FFFFFF",
                    },
                    fontFamily: {
                        display: ["Inter", "sans-serif"],
                        body: ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "0.5rem",
                        'xl': "1rem",
                        '2xl': "1.25rem",
                    },
                },
            },
        };
    </script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<style>
        body { font-family: 'Inter', sans-serif; }::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #D1D5DB; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #9CA3AF; 
        }
    </style>
</head>
<body class="bg-gray-100 text-text-main flex items-center justify-center min-h-screen p-4 transition-colors duration-300">
<div class="fixed inset-0 bg-gray-900/20 backdrop-blur-sm z-0"></div>
<main class="relative z-10 w-full max-w-lg bg-surface-light rounded-2xl shadow-xl border border-gray-200 flex flex-col max-h-[90vh]">
<header class="flex justify-between items-center px-6 py-5 border-b border-gray-100">
<h1 class="text-xl font-bold text-gray-900">Configurações</h1>
<button aria-label="Fechar" class="p-2 -mr-2 rounded-full hover:bg-gray-100 text-gray-400 hover:text-gray-600 transition-colors">
<span class="material-icons-round text-xl">close</span>
</button>
</header>
<div class="flex-1 overflow-y-auto p-6 space-y-5">
<div class="bg-white border border-gray-200 rounded-xl p-5 shadow-sm">
<label class="block text-sm font-semibold text-gray-800 mb-3" for="library-path">
                    Pasta da Biblioteca (PC)
                </label>
<div class="flex gap-2">
<div class="relative flex-grow">
<input class="w-full bg-white border border-gray-300 text-gray-700 text-sm rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent block p-2.5 truncate font-mono shadow-sm" id="library-path" readonly="" type="text" value="C:\Users\frede\OneDrive\Documentos\Devs\Calibre Library"/>
</div>
<button aria-label="Procurar pasta" class="flex items-center justify-center px-3 py-2 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 hover:border-gray-400 transition-all text-gray-600 shadow-sm">
<span class="material-icons-round text-lg">folder_open</span>
</button>
</div>
</div>
<div class="bg-white border border-gray-200 rounded-xl p-5 shadow-sm">
<label class="block text-sm font-semibold text-gray-800 mb-1" for="threads">
                    Processamento Simultâneo (Threads)
                </label>
<p class="text-xs text-gray-500 mb-3 leading-relaxed">
                    Quantos livros o sistema tentará escanear por vez. Mais threads = mais rápido, porém requer mais RAM e CPU. Recomendado: 2.
                </p>
<input class="w-full bg-white border border-gray-300 text-gray-800 text-sm rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent block p-2.5 font-mono shadow-sm" id="threads" max="16" min="1" type="number" value="4"/>
</div>
<div class="bg-white border border-gray-200 rounded-xl p-5 shadow-sm">
<label class="block text-sm font-semibold text-gray-800 mb-1" for="kindle-path">
                    Caminho Manual do Kindle (USB)
                </label>
<p class="text-xs text-gray-500 mb-3">
                    Altere apenas se a detecção automática falhar.
                </p>
<div class="flex gap-2">
<input class="flex-grow bg-white border border-gray-300 text-gray-700 text-sm rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent block p-2.5 font-mono shadow-sm" id="kindle-path" type="text" value="D:/documents"/>
<button aria-label="Procurar pasta" class="flex items-center justify-center px-3 py-2 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 hover:border-gray-400 transition-all text-gray-600 shadow-sm">
<span class="material-icons-round text-lg">folder_open</span>
</button>
</div>
</div>
<div class="bg-gray-50 border border-gray-200 rounded-xl p-5 space-y-4 shadow-inner">
<h3 class="text-sm font-semibold text-gray-800">Conexão e Preferências</h3>
<div class="flex items-center justify-between">
<span class="text-sm text-gray-600">Auto-scan ao iniciar</span>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-primary rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<span class="material-icons-round text-base text-gray-500">dark_mode</span>
<span class="text-sm text-gray-600">Modo Escuro</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" id="darkModeToggle" type="checkbox" value=""/>
<div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-primary rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
</div>
</div>
<footer class="p-6 pt-2 pb-6 flex justify-end bg-gray-50 rounded-b-2xl border-t border-gray-100">
<button class="bg-primary hover:bg-primary-dark text-white font-semibold py-2.5 px-6 rounded-lg shadow-md hover:shadow-lg transition-all duration-200 transform hover:-translate-y-0.5 active:translate-y-0 text-sm">
                Salvar e Re-escanear
            </button>
</footer>
</main>
<script>
        // Optional: Keep toggle logic if user wants to switch themes manually later, 
        // but default is now fully light mode as requested.
        const toggle = document.getElementById('darkModeToggle');
        const html = document.documentElement;
        toggle.addEventListener('change', () => {
            if (toggle.checked) {
                html.classList.add('dark');
            } else {
                html.classList.remove('dark');
            }
        });
    </script>

</body></html>

<script>
        tailwind.config = {
            darkMode: "class",

                extend: {
                    colors: {
                        primary: "#FF007F", // Vibrant Deep Pink
                        "primary-hover": "#D60068", // Darker Pink for hover
                        "primary-light": "#FFC2E0", // Light Pink for accents
                        "primary-focus": "#FF1493", // Deep Pink for focus rings
                        "background-light": "#2D0A1E", // Deep Plum Background (replacing light mode concept with dark for this variant)
                        "background-dark": "#1A0512", // Very dark plum/black
                        "surface-light": "#3B1028", // Lighter Plum modal background
                        "surface-dark": "#240818", // Dark Plum modal
                        "border-light": "#5D1A3E", // Pinkish border
                        "border-dark": "#4A1030", // Darker border
                        "text-main-light": "#FDE2EE", // Very light pink/white text
                        "text-main-dark": "#FDE2EE", // Same for dark mode context
                        "text-sub-light": "#D88BAD", // Muted pink text
                        "text-sub-dark": "#D88BAD", // Muted pink text
                        "input-bg": "#45142E", // Dark Plum input background
                    },
                    fontFamily: {
                        display: ["Inter", "sans-serif"], // Switching to Inter for high-tech look, keeping Merriweather available if needed but Inter fits better
                        body: ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "0.5rem", // slightly softer corners for modern feel
                    },
                    boxShadow: {
                        'soft': '0 4px 6px -1px rgba(255, 0, 127, 0.1), 0 2px 4px -1px rgba(255, 0, 127, 0.06)',
                        'modal': '0 0 50px -12px rgba(255, 0, 127, 0.25)', // Pink glow

                    }
                },
            },
        };

<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Configurações - Library Manager</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#FFFFFF", // High contrast white button as seen in reference
                        "primary-dark": "#E5E5E5",
                        "accent": "#3B82F6", // Blue for focus states
                        "background-light": "#F3F4F6", // Light grey background
                        "background-dark": "#0F0F11", // Deep dark background
                        "surface-light": "#FFFFFF",
                        "surface-dark": "#18181B", // Slightly lighter dark for modal
                        "card-light": "#F9FAFB",
                        "card-dark": "#202023",
                        "border-light": "#E5E7EB",
                        "border-dark": "#2E2E33",
                        "input-bg-light": "#FFFFFF",
                        "input-bg-dark": "#0F0F11",
                    },
                    fontFamily: {
                        display: ["Inter", "sans-serif"],
                        body: ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "0.5rem",
                        'xl': "1rem",
                        '2xl': "1.25rem",
                    },
                },
            },
        };
    </script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<style>
        body { font-family: 'Inter', sans-serif; }::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #4B5563; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6B7280; 
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-gray-900 dark:text-gray-100 flex items-center justify-center min-h-screen p-4 transition-colors duration-300">
<div class="fixed inset-0 bg-black/40 dark:bg-black/80 backdrop-blur-sm z-0"></div>
<main class="relative z-10 w-full max-w-lg bg-surface-light dark:bg-surface-dark rounded-2xl shadow-2xl border border-border-light dark:border-border-dark flex flex-col max-h-[90vh]">
<header class="flex justify-between items-center px-6 py-5 border-b border-border-light dark:border-border-dark">
<h1 class="text-xl font-bold text-gray-900 dark:text-white">Configurações</h1>
<button aria-label="Fechar" class="p-2 -mr-2 rounded-full hover:bg-gray-100 dark:hover:bg-card-dark text-gray-500 dark:text-gray-400 transition-colors">
<span class="material-icons-round text-xl">close</span>
</button>
</header>
<div class="flex-1 overflow-y-auto p-6 space-y-5">
<div class="bg-card-light dark:bg-card-dark border border-border-light dark:border-border-dark rounded-xl p-4">
<label class="block text-sm font-semibold text-gray-800 dark:text-gray-200 mb-3" for="library-path">
                    Pasta da Biblioteca (PC)
                </label>
<div class="flex gap-2">
<div class="relative flex-grow">
<input class="w-full bg-input-bg-light dark:bg-input-bg-dark border border-border-light dark:border-border-dark text-gray-600 dark:text-gray-300 text-sm rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent block p-2.5 truncate font-mono" id="library-path" readonly="" type="text" value="C:\Users\frede\OneDrive\Documentos\Devs\Calibre Library"/>
</div>
<button aria-label="Procurar pasta" class="flex items-center justify-center px-3 py-2 bg-input-bg-light dark:bg-input-bg-dark border border-border-light dark:border-border-dark rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 hover:border-gray-300 dark:hover:border-gray-600 transition-all text-gray-600 dark:text-gray-400">
<span class="material-icons-round text-lg">folder_open</span>
</button>
</div>
</div>
<div class="bg-card-light dark:bg-card-dark border border-border-light dark:border-border-dark rounded-xl p-4">
<label class="block text-sm font-semibold text-gray-800 dark:text-gray-200 mb-1" for="threads">
                    Processamento Simultâneo (Threads)
                </label>
<p class="text-xs text-gray-500 dark:text-gray-500 mb-3 leading-relaxed">
                    Quantos livros o sistema tentará escanear por vez. Mais threads = mais rápido, porém requer mais RAM e CPU. Recomendado: 2.
                </p>
<input class="w-full bg-input-bg-light dark:bg-input-bg-dark border border-border-light dark:border-border-dark text-gray-900 dark:text-white text-sm rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent block p-2.5 font-mono" id="threads" max="16" min="1" type="number" value="4"/>
</div>
<div class="bg-card-light dark:bg-card-dark border border-border-light dark:border-border-dark rounded-xl p-4">
<label class="block text-sm font-semibold text-gray-800 dark:text-gray-200 mb-1" for="kindle-path">
                    Caminho Manual do Kindle (USB)
                </label>
<p class="text-xs text-gray-500 dark:text-gray-500 mb-3">
                    Altere apenas se a detecção automática falhar.
                </p>
<div class="flex gap-2">
<input class="flex-grow bg-input-bg-light dark:bg-input-bg-dark border border-border-light dark:border-border-dark text-gray-600 dark:text-gray-300 text-sm rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent block p-2.5 font-mono" id="kindle-path" type="text" value="D:/documents"/>
<button aria-label="Procurar pasta" class="flex items-center justify-center px-3 py-2 bg-input-bg-light dark:bg-input-bg-dark border border-border-light dark:border-border-dark rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 hover:border-gray-300 dark:hover:border-gray-600 transition-all text-gray-600 dark:text-gray-400">
<span class="material-icons-round text-lg">folder_open</span>
</button>
</div>
</div>
<div class="bg-card-light dark:bg-card-dark border border-border-light dark:border-border-dark rounded-xl p-4 space-y-4">
<h3 class="text-sm font-semibold text-gray-800 dark:text-gray-200">Conexão e Preferências</h3>
<div class="flex items-center justify-between">
<span class="text-sm text-gray-600 dark:text-gray-400">Auto-scan ao iniciar</span>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-accent dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-primary peer-checked:bg-slate-200 dark:peer-checked:bg-white dark:peer-checked:after:border-gray-300 peer-checked:after:bg-gray-800 dark:peer-checked:after:bg-gray-900"></div>
</label>
</div>
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<span class="material-icons-round text-base text-gray-500 dark:text-gray-400">dark_mode</span>
<span class="text-sm text-gray-600 dark:text-gray-400">Modo Escuro</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" id="darkModeToggle" type="checkbox" value=""/>
<div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-accent dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-primary peer-checked:bg-slate-200 dark:peer-checked:bg-white dark:peer-checked:after:border-gray-300 peer-checked:after:bg-gray-800 dark:peer-checked:after:bg-gray-900"></div>
</label>
</div>
</div>
</div>
<footer class="p-6 pt-2 pb-6 flex justify-end">
<button class="bg-primary hover:bg-primary-dark text-black font-semibold py-2.5 px-6 rounded-lg shadow-lg hover:shadow-xl transition-all duration-200 transform hover:-translate-y-0.5 active:translate-y-0 text-sm">
                Salvar e Re-escanear
            </button>
</footer>
</main>
<script>
        const toggle = document.getElementById('darkModeToggle');
        const html = document.documentElement;
        // Init based on toggle state
        if (toggle.checked) {
            html.classList.add('dark');
        } else {
            html.classList.remove('dark');
        }
        toggle.addEventListener('change', () => {
            if (toggle.checked) {
                html.classList.add('dark');
            } else {
                html.classList.remove('dark');
            }
        });
    </script>

</body></html>

<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Configurações - Library Manager</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#E11D48", // Vibrant Rose
                        "primary-dark": "#BE123C", // Darker rose for hover
                        "primary-light": "#FDA4AF", // Light rose
                        "background-pink": "#FFF1F2", // Light blush pink
                        "surface-pink": "#FFF5F7", // Very light pink for modal surface
                        "border-pink": "#FECDD3", // Rose border
                        "text-plum": "#4C0519", // Deep plum for main text
                        "text-sub-plum": "#881337", // Lighter plum/rose for subtext
                        "input-bg": "#FFFFFF",
                    },
                    fontFamily: {
                        display: ["Inter", "sans-serif"],
                        body: ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "0.5rem",
                        'xl': "1rem",
                        '2xl': "1.25rem",
                    },
                },
            },
        };
    </script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #FDA4AF; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #FB7185; 
        }
    </style>
</head>
<body class="bg-background-pink text-text-plum flex items-center justify-center min-h-screen p-4 transition-colors duration-300">
<div class="fixed inset-0 bg-rose-900/20 backdrop-blur-sm z-0"></div>
<main class="relative z-10 w-full max-w-lg bg-surface-pink rounded-2xl shadow-xl border border-rose-100 flex flex-col max-h-[90vh]">
<header class="flex justify-between items-center px-6 py-5 border-b border-rose-100">
<h1 class="text-xl font-bold text-primary">Configurações</h1>
<button aria-label="Fechar" class="p-2 -mr-2 rounded-full hover:bg-rose-100 text-rose-400 hover:text-rose-600 transition-colors">
<span class="material-icons-round text-xl">close</span>
</button>
</header>
<div class="flex-1 overflow-y-auto p-6 space-y-5">
<div class="bg-white border border-rose-200 rounded-xl p-5 shadow-sm">
<label class="block text-sm font-semibold text-text-plum mb-3" for="library-path">
                    Pasta da Biblioteca (PC)
                </label>
<div class="flex gap-2">
<div class="relative flex-grow">
<input class="w-full bg-white border border-rose-200 text-text-plum text-sm rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent block p-2.5 truncate font-mono shadow-sm placeholder-rose-300" id="library-path" readonly="" type="text" value="C:\Users\frede\OneDrive\Documentos\Devs\Calibre Library"/>
</div>
<button aria-label="Procurar pasta" class="flex items-center justify-center px-3 py-2 bg-white border border-rose-200 rounded-lg hover:bg-rose-50 hover:border-rose-300 transition-all text-primary shadow-sm">
<span class="material-icons-round text-lg">folder_open</span>
</button>
</div>
</div>
<div class="bg-white border border-rose-200 rounded-xl p-5 shadow-sm">
<label class="block text-sm font-semibold text-text-plum mb-1" for="threads">
                    Processamento Simultâneo (Threads)
                </label>
<p class="text-xs text-text-sub-plum mb-3 leading-relaxed">
                    Quantos livros o sistema tentará escanear por vez. Mais threads = mais rápido, porém requer mais RAM e CPU. Recomendado: 2.
                </p>
<input class="w-full bg-white border border-rose-200 text-text-plum text-sm rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent block p-2.5 font-mono shadow-sm" id="threads" max="16" min="1" type="number" value="4"/>
</div>
<div class="bg-white border border-rose-200 rounded-xl p-5 shadow-sm">
<label class="block text-sm font-semibold text-text-plum mb-1" for="kindle-path">
                    Caminho Manual do Kindle (USB)
                </label>
<p class="text-xs text-text-sub-plum mb-3">
                    Altere apenas se a detecção automática falhar.
                </p>
<div class="flex gap-2">
<input class="flex-grow bg-white border border-rose-200 text-text-plum text-sm rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent block p-2.5 font-mono shadow-sm" id="kindle-path" type="text" value="D:/documents"/>
<button aria-label="Procurar pasta" class="flex items-center justify-center px-3 py-2 bg-white border border-rose-200 rounded-lg hover:bg-rose-50 hover:border-rose-300 transition-all text-primary shadow-sm">
<span class="material-icons-round text-lg">folder_open</span>
</button>
</div>
</div>
<div class="bg-rose-50 border border-rose-100 rounded-xl p-5 space-y-4 shadow-inner">
<h3 class="text-sm font-semibold text-primary">Conexão e Preferências</h3>
<div class="flex items-center justify-between">
<span class="text-sm text-text-sub-plum">Auto-scan ao iniciar</span>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-rose-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-primary rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<span class="material-icons-round text-base text-rose-400">dark_mode</span>
<span class="text-sm text-text-sub-plum">Modo Escuro</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" id="darkModeToggle" type="checkbox" value=""/>
<div class="w-11 h-6 bg-rose-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-primary rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
</div>
</div>
<footer class="p-6 pt-2 pb-6 flex justify-end bg-rose-50/50 rounded-b-2xl border-t border-rose-100">
<button class="bg-primary hover:bg-primary-dark text-white font-semibold py-2.5 px-6 rounded-lg shadow-md hover:shadow-lg transition-all duration-200 transform hover:-translate-y-0.5 active:translate-y-0 text-sm ring-2 ring-primary ring-opacity-50">
                Salvar e Re-escanear
            </button>
</footer>
</main>
<script>
        // Optional: Keep toggle logic if user wants to switch themes manually later
        const toggle = document.getElementById('darkModeToggle');
        const html = document.documentElement;
        toggle.addEventListener('change', () => {
            if (toggle.checked) {
                html.classList.add('dark');
            } else {
                html.classList.remove('dark');
            }
        });
    </script>

</body></html>
